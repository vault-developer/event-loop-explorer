<!doctype html>
<html lang="en" class="dark" data-theme="midnight" style="color-scheme: dark">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<link rel="icon" type="image/png" href="/icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Event Loop Explorer</title>
		<meta
			name="description"
			content="Simulate javascript execution in browser environment"
		/>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme = stored;
					if (stored === 'dark') theme = 'midnight';
					else if (stored === 'light') theme = 'paper';
					var lightThemes = { paper: 1, github: 1 };
					var known = {
						midnight: 1,
						paper: 1,
						nord: 1,
						dracula: 1,
						monokai: 1,
						catppuccin: 1,
						solarized: 1,
						github: 1,
					};
					if (!theme || !known[theme]) theme = 'midnight';
					var isLight = !!lightThemes[theme];
					document.documentElement.setAttribute('data-theme', theme);
					if (isLight) {
						document.documentElement.classList.remove('dark');
						document.documentElement.style.colorScheme = 'light';
					} else {
						document.documentElement.classList.add('dark');
						document.documentElement.style.colorScheme = 'dark';
					}
				} catch (_) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
